name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Build release
      run: cargo build --release
    - name: Upload binary
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/snapsbom
