name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.npm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            npm: snapsbom-darwin-arm64
            bin: snapsbom
          - os: macos-latest
            target: x86_64-apple-darwin
            npm: snapsbom-darwin-x64
            bin: snapsbom
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            npm: snapsbom-linux-x64
            bin: snapsbom
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            npm: snapsbom-linux-arm64
            bin: snapsbom
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm: snapsbom-windows-x64
            bin: snapsbom.exe
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary into its platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "npm/${{ matrix.npm }}/bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
             "npm/${{ matrix.npm }}/bin/${{ matrix.bin }}"
          ls -l "npm/${{ matrix.npm }}/bin/"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm }}
          path: npm/${{ matrix.npm }}/bin/${{ matrix.bin }}
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish ${{ matrix.npm }}
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ matrix.npm }}"
          ver="$(node -p "require('./npm/' + process.argv[1] + '/package.json').version" "$pkg")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on the registry — skipping."
            exit 0
          fi
          npm publish "./npm/$pkg" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: publish snapsbom
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish snapsbom
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          if npm view "snapsbom@$ver" version >/dev/null 2>&1; then
            echo "snapsbom@$ver is already on the registry — skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: attach binaries
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect binaries with per-platform names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/*/; do
            name=$(basename "$d")
            ext=""
            case "$name" in *win32*) ext=".exe" ;; esac
            cp "$d"/* "release/${name}${ext}"
          done
          ls -la release
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
