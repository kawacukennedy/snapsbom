  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.5"/>
  <path d="M168 80h-80v48H168v48h-80" fill="none" stroke="url(#sb-trace)" stroke-width="30"
