<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SnapSBOM">
  <title>SnapSBOM</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152a52"/>
      <stop offset="55%" stop-color="#0c1530"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="trace" x1="70" y1="56" x2="188" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#41e3ff"/>
      <stop offset="50%" stop-color="#5b7cff"/>
      <stop offset="100%" stop-color="#9d7bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="256" height="256" rx="60"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <rect width="256" height="256" fill="url(#gloss)"/>
  </g>
  <rect x="1.25" y="1.25" width="253.5" height="253.5" rx="58.75" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <path d="M170 82 H86 V128 H170 V174 H86" fill="none" stroke="url(#trace)"
        stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="82" r="10" fill="#39e1a3"/>
  <circle cx="86" cy="174" r="10" fill="#39e1a3"/>
</svg>
