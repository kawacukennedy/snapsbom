<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="snapsbom-logo-title">
  <title id="snapsbom-logo-title">SnapSBOM</title>
  <defs>
    <linearGradient id="sb-tile" x1="26" y1="8" x2="232" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18305B"/>
      <stop offset=".55" stop-color="#0C1530"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="sb-trace" x1="168" y1="80" x2="88" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#41E3FF"/>
      <stop offset=".5" stop-color="#5B7CFF"/>
