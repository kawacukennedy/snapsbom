[package]
name = "snapsbom"
version = "0.2.2"
edition = "2021"
authors = ["SnapSBOM Contributors"]
description = "Deterministic SBOM generator that runs in CLI and WASM with zero cloud, zero friction"
license = "MIT"
repository = "https://github.com/kawacukennedy/snapsbom"
homepage = "https://kawacukennedy.github.io/snapsbom/"
readme = "README.md"
# crates.io allows a maximum of 5 keywords — "security" was dropped as the
# most generic of the six, since "sbom"/"spdx"/"cyclonedx" cover discovery.
keywords = ["sbom", "spdx", "cyclonedx", "supply-chain", "deterministic"]
categories = ["command-line-utilities", "development-tools", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "snapsbom"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
indexmap = "2.6"
percent-encoding = "2.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["File", "FileReader", "Blob", "Event", "ProgressEvent", "console"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.13"
