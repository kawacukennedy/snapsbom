[package]
name = "snapsbom"
version = "0.1.0"
edition = "2021"
authors = ["SnapSBOM Contributors"]
description = "Deterministic SBOM generator that runs in CLI and WASM"
license = "MIT"
repository = "https://github.com/snapsbom/snapsbom"
homepage = "https://snapsbom.dev"
readme = "README.md"
keywords = ["sbom", "spdx", "cyclonedx", "security", "supply-chain"]
categories = ["command-line-utilities", "development-tools", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "snapsbom"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
